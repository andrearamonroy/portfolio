<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dream Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--page:#c9b3ee;--ink:#2b1a4a;--glass:rgba(74,40,130,.42);--edge:rgba(255,255,255,.7);color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#3b2e6b;color-scheme:dark}}
:root[data-theme="dark"]{--page:#3b2e6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);font-family:"DM Sans",system-ui,sans-serif;color:var(--ink)}
.track{height:600vh;position:relative}
.stage{position:sticky;top:0;height:100vh;overflow:hidden;
  background:linear-gradient(180deg,#5b8be0 0%,#8fb0ee 22%,#c3b2ee 48%,#f0c3dc 74%,#ffd2c4 100%);background-size:100% 320%}
.abs{position:absolute;left:0;top:0;will-change:transform}
.cloud{pointer-events:none}
.cloud i{position:absolute;border-radius:50%;filter:blur(7px);
  background:radial-gradient(closest-side,rgba(255,255,255,.96),rgba(255,255,255,0))}
.cloud.pink i{background:radial-gradient(closest-side,rgba(255,214,222,.95),rgba(255,190,210,0))}
.cloud.lav i{background:radial-gradient(closest-side,rgba(226,214,255,.95),rgba(205,190,250,0))}
svg{display:block;overflow:visible}
#cord{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.title{position:absolute;left:50%;bottom:100%;width:min(92vw,620px);margin-bottom:2.2vh;text-align:center;transform:translateX(-50%);color:#fff}
.title h1{margin:0;font:800 clamp(38px,8vw,84px)/1 Syne,sans-serif;letter-spacing:.01em;text-shadow:0 2px 24px rgba(70,40,140,.35)}
.title p{margin:.7em auto 0;max-width:30em;font-size:clamp(13px,1.7vw,17px);line-height:1.5;text-shadow:0 1px 12px rgba(70,40,140,.45)}
.glass{position:absolute;left:0;top:0;width:clamp(150px,25vw,250px);padding:14px 16px;border-radius:16px;color:#fff;
  background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  text-shadow:0 1px 8px rgba(70,40,140,.45);will-change:transform,opacity}
.glass b{display:block;font:600 15px/1.25 Syne,sans-serif;margin-bottom:6px}
.glass span{font-size:13px;line-height:1.45}
.hint{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);color:#fff;font-size:13px;
  text-shadow:0 1px 8px rgba(70,40,140,.5);transition:opacity .4s}
.glass{pointer-events:none;z-index:2}
.win,#winC{z-index:5}
#phone{z-index:4}
#cam{z-index:3;transform-origin:50% 0}
#cam svg{width:100%;height:auto}
.scr{position:absolute;left:8.33%;top:23%;width:58%;height:61.5%;display:flex;gap:3%;padding:2.5%;background:#fff8f2;color:#3a2150;overflow:hidden;font-size:var(--cf,13px);line-height:1.4}
.cph{flex:0 0 38%;position:relative;border-radius:8px;border:2px solid #e58fb4;background:#fbe7f0;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;color:#a2587e;font-size:.8em;overflow:hidden}
.cph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cph input{display:none}
.bio{flex:1;min-width:0;overflow:auto}
.bio h3{margin:0 0 .3em;font:800 1.35em/1.1 Syne,sans-serif;outline:none}
.bio p{margin:0;outline:none}
.bio h3:focus,.bio p:focus{box-shadow:0 0 0 2px #e58fb4;border-radius:6px}
.hide{display:none!important}
.sheet.wide{width:min(780px,100%)}
.sheet li.go{cursor:pointer}.sheet li.go:hover,.sheet li.go:focus-visible{border-color:#e0679c;outline:none}
.sheet li.go span:last-child{color:#c2457f;font-weight:500}
#pDetail{display:grid;grid-template-columns:minmax(96px,30%) 1fr;min-height:0;flex:1;overflow:hidden}
.dmenu{display:flex;flex-direction:column;gap:8px;padding:14px 12px;background:#fbe3ee;border-right:3px solid #e58fb4;overflow:auto}
.dmenu button{text-align:left;border:2px solid #f1c3d6;background:#fff;border-radius:10px;padding:9px 10px;font:600 13px/1.25 Syne,sans-serif;color:#3a2150;cursor:pointer}
.dmenu button.on{background:#e0679c;color:#fff;border-color:#c9709a}
.dmain{padding:16px 18px 20px;overflow:auto;overscroll-behavior:contain}
.dmain h3{margin:0 0 4px;font:800 20px/1.1 Syne,sans-serif}
.dmain p{margin:6px 0;font-size:13.5px;line-height:1.5;color:#6a4a62}
.dmain p.note{font-size:11.5px;color:#a2587e}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin:12px 0}
.pics div{position:relative}.pics img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;border:2px solid #f1c3d6;display:block}
.pics button{position:absolute;top:4px;right:4px;border:0;width:22px;height:22px;border-radius:50%;background:#e0679c;color:#fff;cursor:pointer}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.lnk,.btn2{display:inline-block;border:0;border-radius:99px;padding:8px 14px;background:#e0679c;color:#fff;font:600 13px Syne,sans-serif;text-decoration:none;cursor:pointer}
.btn2{background:#fff;color:#c2457f;border:2px solid #e0679c;margin-top:6px}
.dmain label{display:block;margin:10px 0 4px;font-size:12px;font-weight:500;color:#7a4568}
.dmain input[type=text],.dmain textarea{width:100%;border:2px solid #f1c3d6;border-radius:10px;padding:8px 10px;font:inherit;font-size:13px;background:#fff;color:#3a2150}
.dmain textarea{min-height:90px;resize:vertical}
.win{cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
.win:hover svg{filter:drop-shadow(0 6px 14px rgba(120,50,110,.4)) brightness(1.04)}
.win:focus-visible svg{filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 2px #fff)}
.wl{position:absolute;left:12%;right:12%;top:36%;padding:.5em .3em;text-align:center;background:#fff7d8;border:2px solid #e0679c;border-radius:8px;font:600 clamp(12px,1.6vw,17px)/1.2 Syne,sans-serif;color:#7a2a55;pointer-events:none}
.wl small{display:block;margin-top:.25em;font:500 .68em DM Sans,sans-serif;color:#a2587e}
.pbtn{position:absolute;z-index:2;border:0;padding:0;border-radius:5px;background:#f7e9a3;box-shadow:inset 0 0 0 2px #d9c471;color:#6b4a12;font:600 var(--fs,12px)/1 Syne,sans-serif;cursor:pointer;opacity:0;pointer-events:none}
.pbtn:focus-visible{outline:2px solid #e0679c;outline-offset:2px}
#panel{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));background:rgba(60,40,110,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#panel.open{display:flex}
.sheet{width:min(520px,100%);max-height:min(80vh,640px);display:flex;flex-direction:column;background:#fff8f2;color:#3a2150;border-radius:20px;border:3px solid #e58fb4;box-shadow:0 24px 60px rgba(40,20,90,.45);overflow:hidden;animation:pop .22s ease-out}
@keyframes pop{from{transform:translateY(14px) scale(.96);opacity:0}}
.sheet header{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 12px;background:#f9d3e3;border-bottom:3px solid #e58fb4}
.sheet header div{flex:1}
.sheet h2{margin:0;font:800 22px/1.1 Syne,sans-serif}
.sheet header p{margin:4px 0 0;font-size:13px;color:#7a4568}
.sheet .x{border:0;background:#e0679c;color:#fff;width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer}
.sheet ul{list-style:none;margin:0;padding:14px 20px 20px;overflow:auto;overscroll-behavior:contain;display:grid;gap:10px}
.sheet li{padding:12px 14px;border-radius:12px;background:#fff;border:2px solid #f1c3d6}
.sheet li b{font:600 15px Syne,sans-serif}
.sheet li span{display:block;margin-top:3px;font-size:13px;line-height:1.45;color:#6a4a62}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tags em{font-style:normal;font-size:11.5px;padding:2px 8px;border-radius:99px;background:#fbe7a8;color:#6b4a12}
@media (max-width:719px){.glass{padding:10px 12px}.glass b{font-size:13px}.glass span{font-size:12px}}
.name{margin:0 0 clamp(12px,2.6vh,26px);padding-top:.1em;text-align:center;white-space:nowrap;color:#fff;font:800 48px/1.12 Syne,sans-serif;letter-spacing:.01em;text-shadow:0 3px 0 #e0679c,0 6px 0 #c9709a,0 18px 32px rgba(70,40,140,.45)}
.orbit{--o:420px;position:relative;width:var(--o);height:var(--o);margin:.8em auto 0}
.orb{position:absolute;left:50%;top:50%;width:48%;aspect-ratio:1;transform:translate(-50%,-50%);overflow:hidden;border-radius:50%;border:5px solid #fff;background:linear-gradient(180deg,#f4eefb,#ffe9ee);box-shadow:0 16px 40px rgba(60,30,120,.35)}
.orb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ring,.spin{position:absolute;left:50%;top:50%;border-radius:50%;width:calc(var(--o)*var(--k));height:calc(var(--o)*var(--k));margin:calc(var(--o)*var(--k)/-2) 0 0 calc(var(--o)*var(--k)/-2)}
#ring1,#spin1{--k:.68}#ring2,#spin2{--k:1}
.ring{border:2px dashed rgba(255,255,255,.75)}
.spin{animation:turn 55s linear infinite}.spin.rev{animation-duration:75s;animation-direction:reverse}
.sat{position:absolute;left:50%;top:50%;transform:rotate(var(--a)) translateY(calc(var(--o)*var(--k)/-2)) rotate(calc(var(--a)*-1))}
.sat span{display:block;translate:-50% -50%;white-space:nowrap;padding:.3em .85em;border-radius:99px;background:#f7e9a3;border:2px solid #d9c471;color:#6b4a12;font:600 .9em/1.2 Syne,sans-serif;box-shadow:0 4px 12px rgba(60,30,120,.25);animation:turn 55s linear infinite reverse}
.spin.rev .sat span{animation-duration:75s;animation-direction:normal}
@keyframes turn{to{rotate:360deg}}
@media (prefers-reduced-motion:reduce){.spin,.sat span{animation:none}}
#cam .role{margin:1.3em 0 0;text-align:center;font:800 1.7em/1.1 Syne,sans-serif;color:#fff;text-shadow:0 2px 14px rgba(70,40,140,.55)}
#cam .tag{margin:.6em auto 0;max-width:34em;text-align:center;font-size:1.05em;line-height:1.5;color:#fff;text-shadow:0 1px 10px rgba(70,40,140,.6)}
.sheet.wide{width:min(980px,100%);max-height:min(90vh,820px)}
.sheet.wide header{padding:10px 16px}.sheet.wide h2{font-size:18px}
#pDetail{grid-template-columns:132px 1fr}
.dmenu{padding:10px 8px;gap:6px}
.dmenu button{padding:7px 8px;font-size:12px;border-radius:8px}
.dmain{padding:14px 16px 18px}
.pics{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:max-content;gap:10px;overflow-x:auto;margin:10px 0;padding:0 0 10px;cursor:grab;scrollbar-width:auto;scrollbar-color:#d8447f #f6d3e2}
.pics.drag{cursor:grabbing;user-select:none}
.dmenu,.dmain,.sheet ul,#pForm{scrollbar-width:auto;scrollbar-color:#d8447f #f6d3e2}
.dmenu::-webkit-scrollbar,.dmain::-webkit-scrollbar,.sheet ul::-webkit-scrollbar,#pForm::-webkit-scrollbar{width:14px;height:14px}
.dmenu::-webkit-scrollbar-track,.dmain::-webkit-scrollbar-track,.sheet ul::-webkit-scrollbar-track,#pForm::-webkit-scrollbar-track{background:#f6d3e2;border-radius:99px}
.dmenu::-webkit-scrollbar-thumb,.dmain::-webkit-scrollbar-thumb,.sheet ul::-webkit-scrollbar-thumb,#pForm::-webkit-scrollbar-thumb{background:#d8447f;border-radius:99px;border:3px solid #f6d3e2}
.dmenu{cursor:grab}.dmenu.drag{cursor:grabbing;user-select:none}

.pics img{width:auto;height:clamp(200px,36vh,320px);aspect-ratio:auto;object-fit:contain;background:#fbe7f0;-webkit-user-drag:none;user-select:none}
.pics::-webkit-scrollbar{height:14px}
.pics::-webkit-scrollbar-track{background:#f6d3e2;border-radius:99px}
.pics::-webkit-scrollbar-thumb{background:#d8447f;border-radius:99px;border:3px solid #f6d3e2}
.pics::-webkit-scrollbar-thumb:hover{background:#b92f68}
.lnk{display:inline-flex;align-items:center;gap:7px;padding:8px 14px 8px 11px;font-size:13px}
.lnk svg{width:16px;height:16px;fill:currentColor;flex:none}
.lnk svg.st{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.lnk.gh{background:#2b1a4a}.lnk.as{background:#e0679c}.lnk.web{background:#7a5fd0}
.lnk:hover{filter:brightness(1.12)}
@media (max-width:719px){
 .name{white-space:normal}
 #pDetail{grid-template-columns:1fr;grid-template-rows:auto 1fr}
 .dmenu{flex-direction:row;border-right:0;border-bottom:3px solid #e58fb4;padding:8px 10px}
 .dmenu button{white-space:nowrap;flex:none}
}
.nav{position:fixed;top:max(12px,env(safe-area-inset-top));right:14px;z-index:20;display:flex;gap:8px}
.nav a{display:inline-flex;align-items:center;gap:7px;padding:8px 14px 8px 11px;border-radius:99px;background:#fff7d8;border:2px solid #e0679c;color:#7a2a55;font:600 13px/1 Syne,sans-serif;text-decoration:none;box-shadow:0 4px 14px rgba(60,30,120,.25);transition:background .15s,color .15s}
.nav a:hover,.nav a:focus-visible{background:#e0679c;color:#fff;outline:none}
.nav svg{width:16px;height:16px;fill:currentColor;flex:none}
.nav svg.st{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:719px){.nav{right:10px;gap:6px}.nav a{padding:9px}.nav a span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
.nav button{font:inherit;cursor:pointer}
.nav a,.nav button{display:inline-flex;align-items:center;gap:7px;padding:8px 14px 8px 11px;border-radius:99px;background:#fff7d8;border:2px solid #e0679c;color:#7a2a55;font:600 13px/1 Syne,sans-serif;text-decoration:none;box-shadow:0 4px 14px rgba(60,30,120,.25);transition:background .15s,color .15s}
.nav button:hover,.nav button:focus-visible{background:#e0679c;color:#fff;outline:none}
@media (max-width:719px){.nav button{padding:9px}.nav button span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
#pForm{padding:16px 20px 20px;overflow:auto;overscroll-behavior:contain}
.rvbar{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 12px}
.rvwrap{height:min(64vh,640px);overflow:auto;border:2px solid #f1c3d6;border-radius:10px;background:#e9e2f2;padding:10px;scrollbar-width:auto;scrollbar-color:#d8447f #f6d3e2}
.rvimg{display:block;width:100%;max-width:820px;height:auto;margin:0 auto;background:#fff;box-shadow:0 4px 18px rgba(60,30,120,.25)}
.rvwrap .rvframe{height:100%;border:0}
.rvframe{display:block;width:100%;height:min(64vh,640px);border:2px solid #f1c3d6;border-radius:10px;background:#fff}
.rvnote{margin:10px 0 0;font-size:12px;color:#7a4568}
#pForm.rv{padding:14px 18px 16px}
#pForm label{display:block;margin:10px 0 4px;font:500 12px "DM Sans",sans-serif;color:#7a4568}
#pForm input[type=text],#pForm input[type=email],#pForm textarea{width:100%;border:2px solid #f1c3d6;border-radius:10px;padding:9px 11px;font:inherit;font-size:14px;background:#fff;color:#3a2150}
#pForm textarea{min-height:120px;resize:vertical}
#pForm input:focus,#pForm textarea:focus{outline:none;border-color:#e0679c;box-shadow:0 0 0 3px rgba(224,103,156,.25)}
.send{display:inline-flex;align-items:center;gap:8px;margin-top:14px;border:0;border-radius:99px;padding:10px 18px 10px 14px;background:#e0679c;color:#fff;font:600 14px Syne,sans-serif;cursor:pointer}
.send svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.send:hover,.send:focus-visible{filter:brightness(1.1);outline:none}
.cform .alt{margin:12px 0 0;font-size:12.5px;color:#6a4a62}.cform .alt a{color:#c2457f;font-weight:500}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.cerr{margin-top:10px;font-size:13px;color:#b0264f}.cerr:empty{display:none}
.mail{text-align:center;padding:6px 0 2px}
.mail svg{width:min(250px,72%);height:auto;overflow:visible;display:block;margin:0 auto}
.mail svg.okc *{transform-box:fill-box}
.mail svg.okc{width:64px;margin:6px auto 0}
.mail svg.okc circle{transform:scale(0);transform-origin:50% 50%;transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
.mail svg.okc.go circle{transform:scale(1)}
.mail .ms{margin:8px 0 2px;font:800 18px Syne,sans-serif;color:#7a2a55}
.mail .md{margin:0 auto;max-width:34em;font-size:13px;line-height:1.5;color:#6a4a62}
</style>
</head>
<body>
<div class="track">
<div class="stage" id="stage">

<div id="clouds"></div>

<svg id="cord" aria-hidden="true"><path id="cordPath" fill="none" stroke="#b86a93" stroke-width="2.5" stroke-linecap="round"/></svg>

<!-- intro portrait -->
<div class="abs" id="cam">
  <h1 class="name" id="meName"></h1>
  <div class="orbit" id="orbit">
    <div class="orb"><img id="phImg" alt="Portrait of Andrea Monroy"></div>
    <div class="ring" id="ring1"></div><div class="ring" id="ring2"></div>
    <div class="spin" id="spin1"></div><div class="spin rev" id="spin2"></div>
  </div>
  <p class="role" id="meRole"></p>
  <p class="tag" id="meTag"></p>
</div>

<!-- computer -->
<div class="abs" id="comp">
  <svg id="compSvg" viewBox="0 0 400 440" aria-label="Retro pink computer">
    <defs>
      <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d8fe8"/><stop offset=".6" stop-color="#c9a8ee"/><stop offset="1" stop-color="#ffc6d6"/></linearGradient>
      <pattern id="keys" width="16" height="11" patternUnits="userSpaceOnUse"><rect width="16" height="11" fill="#d98bb0"/><rect x="1.5" y="1.5" width="13" height="8" rx="2" fill="#f6c6da"/></pattern>
    </defs>
    <rect x="140" y="240" width="120" height="50" fill="#c9709a"/>
    <rect x="40" y="0" width="320" height="252" rx="22" fill="#eaa5c0" stroke="#c9709a" stroke-width="3"/>
    <rect x="58" y="18" width="284" height="208" rx="12" fill="#d98bb0"/>
    <rect x="72" y="30" width="256" height="184" rx="8" fill="url(#scr)"/>
    <ellipse cx="150" cy="170" rx="70" ry="22" fill="#fff" opacity=".55"/><ellipse cx="240" cy="182" rx="80" ry="24" fill="#ffe4ea" opacity=".7"/><ellipse cx="200" cy="150" rx="46" ry="16" fill="#fff" opacity=".5"/>
    <rect x="90" y="234" width="110" height="4" rx="2" fill="#c9709a"/><rect x="90" y="242" width="110" height="4" rx="2" fill="#c9709a"/>
    <circle cx="318" cy="240" r="5" fill="#ff7aa8"/>
    <path d="M30 292 L370 292 L400 362 L0 362 Z" fill="url(#keys)" stroke="#c9709a" stroke-width="3" stroke-linejoin="round"/>
    <rect x="150" y="340" width="100" height="14" rx="4" fill="#f6c6da" stroke="#c9709a" stroke-width="2"/>
    <rect x="0" y="362" width="400" height="38" rx="8" fill="#e58fb4" stroke="#c9709a" stroke-width="3"/>
  </svg>
</div>

  function openContact(opener){
    var L=DATA.links||{};
    sheet.classList.remove('wide');pForm.classList.remove('rv');$('pList').classList.add('hide');$('pDetail').classList.add('hide');pForm.classList.remove('hide');
    $('pTitle').textContent='Contact';$('pSub').textContent='Say hi. I’ll reply by email.';
    pForm.textContent='';
    var form=mk('form');form.className='cform';
    form.innerHTML='<label for="cN">Your name</label><input type="text" id="cN" name="name" required autocomplete="name">'
      +'<label for="cE">Your email</label><input type="email" id="cE" name="email" required autocomplete="email">'
      +'<label for="cM">Message</label><textarea id="cM" name="message" required></textarea>'
      +'<input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">'
      +'<div class="cerr" id="cErr" role="alert"></div>'
      +'<button class="send" type="submit">'+NI.email+'<span>Send message</span></button>';
    if(L.email){var al=mk('p');al.className='alt';al.appendChild(document.createTextNode('Prefer email? '));var ea=mk('a',L.email);ea.href='mailto:'+L.email;al.appendChild(ea);form.appendChild(al)}
    var stage=mk('div');stage.className='mail hide';
    var art=mk('div'),ms=mk('p'),md=mk('p');ms.className='ms';md.className='md';ms.setAttribute('aria-live','polite');
    stage.appendChild(art);stage.appendChild(ms);stage.appendChild(md);
    pForm.appendChild(form);pForm.appendChild(stage);
    form.addEventListener('submit',function(e){
      e.preventDefault();if(!form.reportValidity())return;
      var fd=new FormData(form);
      form.classList.add('hide');stage.classList.remove('hide');$('cErr').textContent='';
      ms.textContent='Sending…';md.textContent='';
      var anim=runAnim(art,rmq.matches);
      var send=new Promise(function(res){
        if(fd.get('_gotcha')){res({ok:true});return}
        if(!L.formspree){setTimeout(function(){res({ok:true,demo:true})},1200);return}
        var ep=L.formspree;if(ep.indexOf('http')!==0)ep='https://formspree.io/f/'+ep;
        fetch(ep,{method:'POST',body:fd,headers:{'Accept':'application/json'}}).then(function(r){
          return r.json().catch(function(){return{}}).then(function(j){res({ok:r.ok,err:(j.errors&&j.errors.map(function(x){return x.message}).join(' '))||''})});
        }).catch(function(){res({ok:false,err:'Network error. Check your connection and try again.'})});
      });
      Promise.all([anim,send]).then(function(r){var o=r[1];
        if(o.ok){
          art.innerHTML='<svg class="okc" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28" fill="#e0679c"/><path d="M19 33l9 9 17-19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>';var okc=art.firstChild;void okc.getBoundingClientRect();okc.classList.add('go');
          ms.textContent='Message sent';
          md.textContent=o.demo?'Demo only. Add your Formspree form ID in the content file and this will really send.':'Thanks for reaching out. I’ll reply soon.';
          var cb=mk('button','Close');cb.type='button';cb.className='btn2';cb.onclick=closePanel;stage.appendChild(cb);cb.focus();
        }else{
          stage.classList.add('hide');form.classList.remove('hide');
          $('cErr').textContent=(o.err||'Something went wrong.')+(L.email?' You can also email me directly.':'');
        }
      });
    });
    lastFocus=opener;panel.classList.add('open');$('cN').focus();
  }

  var cur=0,target=0;
  function clamp(v,a,b){return Math.min(b,Math.max(a,v))}
  function ease(t){return t*t*(3-2*t)}
  function lerp(a,b,t){return a+(b-a)*t}
  function seg(p,a,b){return clamp((p-a)/(b-a),0,1)}

  function read(){
    var max=track.offsetHeight-innerHeight;
    target=max>0?clamp(scrollY/max,0,1):0;
  }

  function draw(){
    var vw=innerWidth,vh=innerHeight,pr=cur,p=seg(pr,.16,1);
    var narrow=vw<720;
    var W=Math.min(vw*(narrow?.62:.5),vh*(narrow?.5:.58)),H=W*1.1;
    var cx=vw/2,cs=ease(seg(pr,0,.16));
    var Gw=narrow?Math.min(vw*.92,420):Math.min(vw*.92,1400,vh*1.9);
    cam.style.fontSize=(narrow?15:Math.max(13,Math.min(21,Gw/66)))+'px';
    $('orbit').style.setProperty('--o',(narrow?Gw*.78:Math.min(Gw*.46,vh*.5))+'px');
    cam.style.width=Gw+'px';
    $('meName').style.fontSize=(narrow?Gw*.115:Math.min(Gw*.074,104))+'px';
    var gh=cam.offsetHeight,sc=Math.min(1,(vh-100)/gh),gh2=gh*sc,y0=Math.max(62,(vh-gh2)/2);
    cam.style.transform='translate('+(cx-Gw/2)+'px,'+(y0-cs*(y0+gh2+30))+'px) scale('+sc+')';
    cam.style.pointerEvents='none';
    var cy=vh*(0.6-1.3*p)+(1-cs)*vh*1.1;                 // computer centre rises as you scroll
    comp.style.width=W+'px';
    comp.style.transform='translate('+(cx-W/2)+'px,'+(cy-H/2)+'px)';
    

    // windows pop out of the screen, then trail behind with a gentle float
    var e=ease(seg(p,.08,.32));
    var lag=p*vh*.34;
    var sy=cy-H/2+H*.275;                   // screen centre
    var bob=Math.sin(p*14)*5;
    var pe0=ease(seg(p,.28,.92)),pH0=Math.min(vh*.46,420),pW0=pH0*(116/236);
    var py0=lerp(vh*1.08,vh*.5-pH0*.5+vh*.02,pe0),px0=cx-pW0/2,e2=ease(seg(p,.62,.88));
    function place(el,x0,y0,x1,y1,s0,s1,rot,bobSign,tx,ty,tw,hr){
      var ww=W*lerp(s0,s1,e),X=cx+W*lerp(x0,x1,e),Y=sy+H*lerp(y0,y1,e)+lag*e+bob*bobSign*e;
      ww=lerp(ww,tw,e2);X=lerp(X,tx,e2);Y=lerp(Y,ty-tw*hr/2,e2);
      el.style.width=ww+'px';el.style.opacity=1-seg(p,.84,.9);el.style.pointerEvents=p<.84?'auto':'none';
      
      el._x=X-ww/2;el._y=Y;el._w=ww;el.style.transform='translate('+(X-ww/2)+'px,'+Y+'px) rotate('+(rot*e*(1-e2))+'deg)';
    }
    place(winA,-.17,-.09,-.66,.46,.29,.34,-4,1,cx,py0+pH0*79/236,pW0*.42,.75);
    place(winB,.17,-.085,.64,.56,.28,.32,5,-1,cx,py0+pH0*107/236,pW0*.42,.75);
    place(winC,0,-.185,0,.3,.32,.34,0,1,cx,py0+pH0*51/236,pW0*.42,.25);

    // phone rises from the bottom with the hand
    var pe=ease(seg(p,.28,.92));
    var pH=Math.min(vh*.46,420),pW=pH*(116/236);
    var py=lerp(vh*1.08,vh*.5-pH*.5+vh*.02,pe);
    phone.style.width=pW+'px';
    phone.style.transform='translate('+(cx-pW/2)+'px,'+py+'px) rotate('+((1-pe)*5)+'deg)';
    var phoneTop=py,kbBottom=cy+H*.5;

    // cord from keyboard to phone
    var sway=Math.sin(p*9)*22,mid=(kbBottom+phoneTop)/2;
    cordPath.setAttribute('d','M'+cx+' '+kbBottom+' C'+(cx+60+sway)+' '+(mid-30)+' '+(cx-60-sway)+' '+(mid+30)+' '+cx+' '+phoneTop);
    $('cord').style.opacity=seg(p,.2,.34);
    var bo=seg(p,.84,.92),fs=Math.max(10,pW*.085)+'px';
    [pbP,pbL].forEach(function(b){b.style.opacity=bo;b.style.pointerEvents=bo>.6?'auto':'none';b.style.setProperty('--fs',fs)});

    // glass cards
    var cw=gL.offsetWidth;function under(w){return clamp(w._x+w._w/2-cw/2,8,vw-cw-8)}
    function card(el,x,y,a,b){
      el.style.opacity=seg(p,a,b)*(1-(el===gP?0:seg(p,.56,.66)));
      el.style.transform='translate('+x+'px,'+(y+(1-seg(p,a,b))*18)+'px)';
    }
    if(narrow){
      card(gL,under(winA),winA._y+winA._w*.75+12,.3,.42);
      card(gR,under(winB),winB._y+winB._w*.75+12,.34,.46);
      card(gP,clamp(cx-gP.offsetWidth/2,8,vw-gP.offsetWidth-8),py+pH+14,.72,.84);
    }else{
      card(gL,under(winA),winA._y+winA._w*.75+12,.3,.42);
      card(gR,under(winB),winB._y+winB._w*.75+12,.34,.46);
      card(gP,Math.min(vw-gP.offsetWidth-14,cx+pW*.5+24),py+pH*.35,.72,.84);
    }

    // sky + clouds
    stage.style.backgroundPosition='50% '+(p*100)+'%';
    for(var i=0;i<clouds.length;i++){
      var c=clouds[i];
      var y=vh*(c.y/100)-p*vh*c.depth*1.15;
      var x=vw*(c.x/100)+Math.sin(p*3+i)*vw*.02*c.depth;
      c.el.style.transform='translate('+x+'px,'+y+'px)';
    }
    hint.style.opacity=1-seg(pr,0,.06);
  }

  var still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function loop(){
    cur+= (target-cur)*(still?1:.1);
    if(Math.abs(target-cur)<.0003)cur=target;
    draw();requestAnimationFrame(loop);
  }
  addEventListener('scroll',read,{passive:true});
  addEventListener('resize',function(){read();draw()});
  read();cur=target;draw();loop();
})();
</script>
</body>
